{% from "components/icon.html" import icon %}
<div class="customizer-backdrop" data-customizer-close hidden></div>

<aside class="customizer" id="theme_customizer" role="dialog" aria-modal="true" aria-labelledby="customizer_title" data-customizer inert>
  <div class="customizer-header">
    <h2 id="customizer_title">Tampilan</h2>
    <button type="button" class="btn-icon" data-customizer-close aria-label="Tutup pengaturan tampilan">{{ icon("close") }}</button>
  </div>

  <section class="customizer-section">
    <h3>Mode</h3>
    <div class="segmented" role="radiogroup" aria-label="Mode tampilan">
      <button type="button" class="btn segmented-option" role="radio" aria-checked="false" data-pref-option data-pref-key="theme_mode" data-pref-value="light">{{ icon("sun") }} Terang</button>
      <button type="button" class="btn segmented-option" role="radio" aria-checked="false" data-pref-option data-pref-key="theme_mode" data-pref-value="dark">{{ icon("moon") }} Gelap</button>
    </div>
  </section>

  <section class="customizer-section">
    <h3>Warna Aksen</h3>
    <div class="swatch-list" role="radiogroup" aria-label="Warna aksen">
      {% for option in accent_color_option_list %}
        <button type="button" class="swatch swatch-{{ option.key }}" role="radio" aria-checked="false" aria-label="{{ option.label }}" title="{{ option.label }}" data-pref-option data-pref-key="accent_color" data-pref-value="{{ option.hex }}" data-accent-key="{{ option.key }}"></button>
      {% endfor %}
    </div>
  </section>

  <section class="customizer-section">
    <h3>Kerapatan</h3>
    <div class="segmented" role="radiogroup" aria-label="Kerapatan tampilan">
      <button type="button" class="btn segmented-option" role="radio" aria-checked="false" data-pref-option data-pref-key="is_compact_view" data-pref-value="false">Nyaman</button>
      <button type="button" class="btn segmented-option" role="radio" aria-checked="false" data-pref-option data-pref-key="is_compact_view" data-pref-value="true">Rapat</button>
    </div>
  </section>

  <section class="customizer-section">
    <h3>Font</h3>
    <div class="segmented" role="radiogroup" aria-label="Jenis font">
      {% for option in font_family_option_list %}
        <button type="button" class="btn segmented-option font-option-{{ option.key }}" role="radio" aria-checked="false" data-pref-option data-pref-key="font_family" data-pref-value="{{ option.key }}">{{ option.label }}</button>
      {% endfor %}
    </div>
  </section>

  <p class="customizer-status" data-customizer-status aria-live="polite"></p>
</aside>
