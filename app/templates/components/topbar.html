{% from "components/icon.html" import icon %}
{% from "components/user_menu.html" import user_menu with context %}
{# navigasi atas (layar besar): tombol Home di kiri, tombol tema + menu user di kanan #}
<header class="navbar navbar-expand-md d-none d-lg-flex d-print-none app-topbar">
  <div class="container-xl">
    <a href="{{ url_for('main.home') }}" class="btn btn-ghost-secondary app-topbar-home{% if request.endpoint == 'main.home' and not request.args %} active{% endif %}">
      {{ icon("home") }} Home
    </a>
    <div class="navbar-nav flex-row align-items-center gap-2 ms-auto">
      {% include "components/theme_toggle_button.html" %}
      {{ user_menu() }}
    </div>
  </div>
</header>
