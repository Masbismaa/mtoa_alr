{# selalu dirender (walau kosong) biar JS bisa nambahin pesan baru ke sini #}
<div class="flash-list" data-flash-list aria-live="polite">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash flash-{{ category }}" role="alert" data-flash>
      <span class="flash-text">{{ message }}</span>
      <button type="button" class="flash-close" data-flash-close aria-label="Tutup pesan">&times;</button>
    </div>
  {% endfor %}
</div>
