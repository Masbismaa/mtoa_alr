{# editor teks + toolbar format. Isinya otomatis disalin ke textarea tersembunyi #}
{% macro rich_text_editor(name, value="", label="Content", placeholder="Type here...") %}
  <div class="rte" data-rte>
    <div class="btn-toolbar rte-toolbar" role="toolbar" aria-label="Text formatting">
      <div class="btn-group btn-group-sm me-1">
        <button type="button" class="btn rte-button" data-rte-command="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
        <button type="button" class="btn rte-button" data-rte-command="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
        <button type="button" class="btn rte-button" data-rte-command="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
      </div>
      <div class="btn-group btn-group-sm me-1">
        <button type="button" class="btn rte-button" data-rte-command="insertUnorderedList" title="Bullet list" aria-label="Bullet list">&bull; List</button>
        <button type="button" class="btn rte-button" data-rte-command="insertOrderedList" title="Numbered list" aria-label="Numbered list">1. List</button>
      </div>
      <div class="btn-group btn-group-sm">
        <button type="button" class="btn rte-button" data-rte-command="createLink" title="Insert link" aria-label="Insert link">Link</button>
        <button type="button" class="btn rte-button" data-rte-command="code" title="Code" aria-label="Code">&lt;/&gt;</button>
      </div>
    </div>
    <div class="form-control rte-content" contenteditable="true" role="textbox" aria-multiline="true" aria-label="{{ label }}" data-placeholder="{{ placeholder }}" data-rte-content>{{ value | rich_text }}</div>
    <textarea name="{{ name }}" hidden data-rte-input>{{ value | rich_text | forceescape }}</textarea>
  </div>
{% endmacro %}
