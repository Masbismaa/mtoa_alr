{% extends "layouts/auth_base.html" %}

{% block title %}{{ error_title }}{% endblock %}

{% block content %}
  <div class="empty p-0">
    <div class="empty-header">{{ error_code }}</div>
    <p class="empty-title">{{ error_title }}</p>
    <p class="empty-subtitle text-secondary">{{ error_message }}</p>
    <div class="empty-action">
      <a href="{{ url_for('main.home') }}" class="btn btn-primary">Kembali ke Dashboard</a>
    </div>
  </div>
{% endblock %}
