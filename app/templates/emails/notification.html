{# Email HTML: style inline + tabel karena klien email (Outlook/Word, webmail) mengabaikan <style>, flexbox & padding di <a>.
   Merah logo Spindo #E8191F cuma di garis atas & tombol. Skala: teks 15/24, judul 22/30, kecil 13/20; jarak kelipatan 8; gutter 40. #}
<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f2f2f2;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f2f2f2;">
<tr><td align="center" style="padding:32px 16px;">

  <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;background:#ffffff;border:1px solid #e1e1e1;font-family:Arial,Helvetica,sans-serif;color:#32363a;">
    <tr><td height="4" style="height:4px;line-height:4px;font-size:0;background:#E8191F;">&nbsp;</td></tr>

    {# kepala: logo kiri, nama aplikasi kanan, satu baris sejajar tengah #}
    <tr><td style="padding:24px 40px;border-bottom:1px solid #e1e1e1;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
        <td width="80" valign="middle"><img src="cid:spindo-logo" width="80" height="48" alt="SPINDO" style="display:block;border:0;"></td>
        <td valign="middle" align="right" style="font-size:13px;line-height:20px;color:#6a6d70;">Access Link Register</td>
      </tr></table>
    </td></tr>

    <tr><td style="padding:40px 40px 0;">
      <h1 style="margin:0 0 24px;font-size:22px;line-height:30px;font-weight:700;color:#111111;">{{ subject }}</h1>
      {% for paragraph in paragraph_list %}<p style="margin:0 0 16px;font-size:15px;line-height:24px;">{{ paragraph }}</p>{% endfor %}
    </td></tr>

    {% if code %}
    <tr><td style="padding:8px 40px 24px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
        <td align="center" style="padding:24px 16px;background:#f6f6f6;border:1px solid #e1e1e1;">
          {# user-select:all: sekali klik kode langsung terpilih, tinggal Ctrl+C (JS/tombol copy tidak jalan di email) #}
          <span style="font-family:Consolas,'Courier New',monospace;font-size:36px;line-height:44px;font-weight:700;letter-spacing:12px;padding-left:12px;color:#111111;user-select:all;-webkit-user-select:all;">{{ code }}</span>
        </td>
      </tr></table>
    </td></tr>
    {% endif %}

    {% if link %}
    {# tombol "bulletproof": ukuran & padding di <td>, <a> mengisi penuh supaya rapi di Outlook juga #}
    <tr><td style="padding:8px 40px 24px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
        <td align="center" bgcolor="#E8191F" width="220" height="48" style="background:#E8191F;">
          <a href="{{ link }}" style="display:block;width:220px;line-height:48px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;text-align:center;">{{ link_label }}</a>
        </td>
      </tr></table>
    </td></tr>
    <tr><td style="padding:0 40px 16px;font-size:13px;line-height:20px;color:#6a6d70;">
      Tombol tidak bisa diklik? Buka link ini:<br>
      <a href="{{ link }}" style="color:#E8191F;word-break:break-all;">{{ link }}</a>
    </td></tr>
    {% endif %}

    {% if note_list %}
    <tr><td style="padding:0 40px 8px;">
      {% for note in note_list %}<p style="margin:0 0 8px;font-size:13px;line-height:20px;color:#6a6d70;">{{ note }}</p>{% endfor %}
    </td></tr>
    {% endif %}

    <tr><td style="padding:24px 40px 40px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
        <td style="padding-top:24px;border-top:1px solid #e1e1e1;font-size:15px;line-height:24px;color:#111111;">
          Salam,<br>
          <strong>ICT SPINDO</strong><br>
          <span style="font-size:13px;line-height:20px;color:#6a6d70;"> PT STEEL PIPE INDUSTRY OF INDONESIA Tbk </span>
        </td>
      </tr></table>
    </td></tr>
  </table>

  <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;"><tr>
    <td align="center" style="padding:16px 16px 0;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#8a8d90;">Email ini dikirim otomatis oleh sistem ALR, mohon tidak dibalas.</td>
  </tr></table>

</td></tr>
</table>
</body>
</html>
