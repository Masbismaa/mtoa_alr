# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
default:
  tags:
    - build

stages:
  - build
  - test
  - deploy
  - review
  - dast
  - staging
  - canary
  - production
  - incremental rollout 10%
  - incremental rollout 25%
  - incremental rollout 50%
  - incremental rollout 100%
  - performance
  - cleanup
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'
  # fitur auto devops yg butuh docker-in-docker, runner kantor belum support
  BUILD_DISABLED: 'true'
  TEST_DISABLED: 'true'
  CODE_QUALITY_DISABLED: 'true'
  # belum ada deploy, jadi dimatiin sekalian
  AUTO_DEVOPS_PLATFORM_TARGET: ''
  REVIEW_DISABLED: 'true'
  STAGING_ENABLED: ''
  PERFORMANCE_DISABLED: 'true'
  DAST_DISABLED: 'true'
  CONTAINER_SCANNING_DISABLED: 'true'
  BROWSER_PERFORMANCE_DISABLED: 'true'

sast:
  stage: test

secret_detection:
  stage: secret-detection

# jalanin semua unit test project
unit_test:
  stage: test
  image: python:3.13-slim
  script:
    - python --version
    - python -m pip install -r requirements-dev.txt
    - python -m pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

# migrasi + test integrasi di PostgreSQL beneran. unit_test pake SQLite & db.create_all(), jadi ga ngebuktiin
# jalur migrasi, FOR UPDATE (request barengan), index unik ekspresi, & trigger audit log. Butuh runner yg bisa "services".
postgres_test:
  stage: test
  image: python:3.13-slim
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: alr_ci
    POSTGRES_USER: alr_ci
    POSTGRES_PASSWORD: alr_ci_password
    APP_ENV: development
    DATABASE_URL: postgresql+psycopg://alr_ci:alr_ci_password@postgres:5432/alr_ci
    TEST_POSTGRES_URL: postgresql+psycopg://alr_ci:alr_ci_password@postgres:5432/alr_ci
  script:
    - python -m pip install -r requirements-dev.txt
    # kunci acak sekali pakai (database-nya dibuang abis job), sengaja ga ditulis di file ini
    - export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
    - export ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
    # tunggu PostgreSQL siap nerima koneksi (maks 60 detik)
    - python scripts/wait_for_db.py
    - python -m flask --app run db upgrade
    - python -m flask --app run db check
    # 2 migrasi terbaru harus bisa diturunin & dinaikin lagi
    - python -m flask --app run db downgrade b4d9e2a7c1f3
    - python -m flask --app run db downgrade f2b7c9d4e6a1
    - python -m flask --app run db upgrade
    - python -m pytest -q tests/test_postgres_integrasi.py --junitxml=report-postgres.xml
  artifacts:
    when: always
    reports:
      junit: report-postgres.xml

# test komponen React + pastiin app/static/dist (yg di-commit) sama persis sama hasil build source-nya.
# Gagal di langkah diff = ada yg ngubah frontend/src tapi lupa "npm run build" & commit app/static/dist
frontend_test:
  stage: test
  image: node:24-slim
  script:
    - cd frontend
    - npm ci
    - npm test
    - cp -r ../app/static/dist /tmp/dist-committed
    - npm run build
    - diff -r /tmp/dist-committed ../app/static/dist || (echo "app/static/dist beda sama hasil build. Jalankan cd frontend && npm run build, lalu commit app/static/dist" && exit 1)

include:
  - template: Auto-DevOps.gitlab-ci.yml
