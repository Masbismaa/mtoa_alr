<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Access Link Register">
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 40px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 17px; fill: #6b7280; }
    .tag { font-size: 13px; fill: #206bc4; font-weight: 600; letter-spacing: 1.5px; }
    .cell { font-size: 13px; fill: #6b7280; }
    .strong { fill: #1f2937; font-weight: 600; }
    .rule { stroke: #d9dee7; }
    .key rect { fill: #eef2f7; stroke: #d9dee7; }
    .key text { font-size: 12px; fill: #374151; font-family: ui-monospace, Consolas, monospace; }
    .key { animation: press 7.5s infinite; }
    .k1 { animation-delay: 1.5s; } .k2 { animation-delay: 3s; } .k3 { animation-delay: 4.5s; } .k4 { animation-delay: 6s; }
    @keyframes press { 0%, 14%, 100% { opacity: .55; } 3%, 10% { opacity: 1; } }
    .k0 rect, .k1 rect, .k2 rect, .k3 rect, .k4 rect { animation: keyfill 7.5s infinite; animation-delay: inherit; }
    @keyframes keyfill { 0%, 14%, 100% { fill: #eef2f7; stroke: #d9dee7; } 3%, 10% { fill: #e7f0fd; stroke: #206bc4; } }
    .cursor { animation: move 8s infinite; }
    @keyframes move { 0%, 20% { transform: translateY(0); } 25%, 45% { transform: translateY(34px); } 50%, 70% { transform: translateY(68px); } 75%, 95% { transform: translateY(102px); } 100% { transform: translateY(0); } }
    .dot { animation: pulse 2.4s infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: .6s; } .d2 { animation-delay: 1.2s; } .d3 { animation-delay: 1.8s; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.75); } }
    @media (prefers-reduced-motion: reduce) { .key, .key rect, .cursor, .dot { animation: none; } }
  </style>
